  <text x="318" y="149" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#1f2328">User</text><text x="318" y="167" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#1f2328">flows</text>
  <line x1="370" y1="152" x2="386" y2="152" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="388" y="120" width="104" height="64" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <circle cx="404" cy="120" r="12" fill="#00897b"/><text x="404" y="124.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#ffffff">4</text>
  <text x="440" y="157" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#1f2328">Wireframes</text>
