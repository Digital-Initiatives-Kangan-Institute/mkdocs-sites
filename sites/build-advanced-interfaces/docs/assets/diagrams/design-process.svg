  <rect x="144" y="120" width="104" height="64" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="160" cy="120" r="12" fill="#9e9e9e"/><text x="160" y="124.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#ffffff">2</text>
  <text x="196" y="149" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#1f2328">Users and</text><text x="196" y="167" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#1f2328">goals</text>
  <line x1="248" y1="152" x2="264" y2="152" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="266" y="120" width="104" height="64" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
