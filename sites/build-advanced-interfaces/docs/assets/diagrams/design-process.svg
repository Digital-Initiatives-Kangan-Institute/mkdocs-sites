<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="t">
  <title id="t">The design process in seven steps: understand the brief, users and goals, user flows, wireframes, review and test, visual design, and build. Steps 3 and 4, user flows and wireframes, are highlighted. Arrows from review and test loop back to wireframes and to user flows, showing that you go back and update earlier steps</title>
