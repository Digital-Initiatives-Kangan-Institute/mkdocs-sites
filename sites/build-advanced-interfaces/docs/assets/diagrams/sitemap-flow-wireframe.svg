  <title id="t">The same cafe app planned three ways. The sitemap shows every page: Home with Menu, Reviews, Cart and Account below it, and Checkout and Confirmed below Cart. The user flow shows one path through those pages to order a coffee: Menu page, adds items, Cart page, taps Checkout, Checkout page, order placed. The wireframe shows the layout of one screen from that flow, the Cart page</title>
