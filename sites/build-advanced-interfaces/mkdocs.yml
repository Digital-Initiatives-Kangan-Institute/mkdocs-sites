INHERIT: ../../shared/.mkdocs-base.yml

site_name: Build Advanced Interfaces

nav:
  # The Return to Portal item should always be the first item in the navigation.
  - Return to Portal: /

  # Add additional navigation below this point:
  - Menu:
    - Resources:
      - HTML:
        - Introduction: pages/resources/html-css/html-fundamentals.md
        - Document Structure: pages/resources/html-css/document-structure.md
        - Text Elements: pages/resources/html-css/text-elements.md
        - Links and Images: pages/resources/html-css/links-and-images.md
        - Containers and Nesting: pages/resources/html-css/containers-and-nesting.md
        - Lists: pages/resources/html-css/lists.md
        - Tables: pages/resources/html-css/tables.md
        - Forms and Inputs: pages/resources/html-css/forms-and-inputs.md
      - CSS:
        - Introduction: pages/resources/html-css/css-fundamentals.md
        - Selectors and Specificity: pages/resources/html-css/selectors-and-specificity.md
        - The Box Model: pages/resources/html-css/box-model.md
        - Colours and Typography: pages/resources/html-css/colours-and-typography.md
        - Flexbox Layout: pages/resources/html-css/flexbox.md
        - Responsive Design: pages/resources/html-css/responsive-design.md
      - JavaScript:
        - Introduction: pages/resources/javascript/introduction.md
        - Linking JavaScript: pages/resources/javascript/linking-javascript.md
        - Variables and Data Types: pages/resources/javascript/variables.md
        - Control Flow: pages/resources/javascript/control-flow.md
        - Functions: pages/resources/javascript/functions.md
        - Events and the DOM: pages/resources/javascript/events-and-dom.md
        - Bootstrap: pages/resources/javascript/bootstrap.md
      - Web Architecture:
        - The Client-Server Model: pages/resources/architecture/client-server-model.md
        - JSON: pages/resources/architecture/json.md
        - Working with APIs and Fetch: pages/resources/architecture/apis-and-fetch.md
        - Mock APIs: pages/resources/architecture/mock-apis.md
        - Building Forms and Validation: pages/resources/architecture/forms-and-validation.md
      - MQTT:
        - MQTT Overview: pages/resources/mqtt/mqtt-overview.md
        - Connecting to HiveMQ: pages/resources/mqtt/connecting-to-hivemq.md
        - Publishing and Subscribing: pages/resources/mqtt/publishing-and-subscribing.md
        - Working with JSON: pages/resources/mqtt/working-with-json.md
        - Real-Time Chat with MQTT: pages/resources/mqtt/mqtt-chat-example.md
      - Plan & Design:
        - Introduction: pages/resources/design/introduction.md
        - User Flow Diagrams: pages/resources/design/user-flow-diagrams.md
        - Wireframing: pages/resources/design/wireframing.md

    - Tasks:
      - HTML/CSS:
        - Cafe Website: pages/tasks/cafe-website.md
        - Cafe Site Enhancements: pages/tasks/cafe-site-enhancements.md
        - Cafe Site Login: pages/tasks/login-page.md
      - JavaScript and APIs:
        - Cafe Recipes Page: pages/tasks/fetch-api-data.md
      - Plan & Design:
        - Planning User Flows: pages/tasks/planning-user-flows.md
        - Building Wireframes: pages/tasks/building-wireframes.md

# Do not touch anything below this line unless you know what you are doing.
theme:
  palette:
    primary: indigo

plugins:
  - search
  - enumerate-headings:
      increment_across_pages: true
      # Uncomment below if you would like to reset the table of contents numbering
      # after a certain page:
      restart_increment_after:
        - pages/tasks/cafe-website.md
