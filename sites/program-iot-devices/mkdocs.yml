      - Advanced Topics:
        - Combining Multiple Sensors: pages/resources/combining-multiple-sensors.md
        - Lists, Arrays and Loops: pages/resources/lists-arrays-and-loops.md
        - Structured Data: pages/resources/structured-data.md
      - Review:
        - Revision: pages/resources/revision.md
    - Tasks:
      - IoT Programming Activity: pages/tasks/iot-programming-activity.md
      - Digital Output and Functions Task: pages/tasks/digital-output-functions-task.md
      - Reading Inputs and Selection Task: pages/tasks/reading-inputs-selection-task.md
      - Combining Multiple Sensors Task: pages/tasks/combining-multiple-sensors-task.md
      - Lists, Arrays and Loops Task: pages/tasks/lists-arrays-and-loops-task.md
