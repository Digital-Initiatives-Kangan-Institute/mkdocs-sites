# Do not touch anything below this line unless you know what you are doing.
theme:
  name: material
  custom_dir: ../../shared
  palette:
    primary: purple
  features:
    - toc.integrate
    - navigation.sections
    - navigation.path
    - navigation.footer
    - header.hide
    - content.code.copy
    - content.code.annotate

# This is relative to the theme/base (based on custom_dir above)
extra_css:
  - style.css

# MathJax support for the $$ ... $$ formula blocks in the Reading Resources
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# This is here to watch the style.css file above to trigger hot-reload,
# therefor if the custom_dir is changed it should be changed here too.
watch:
  - ../../shared/style.css

plugins:
  - enumerate-headings:
      increment_across_pages: true
      restart_increment_after:
        - pages/resources/study-guide/01-introduction.md
        - pages/resources/introduction-to-iot.md
        - pages/tasks/iot-programming-activity.md
        - pages/tasks/class-activities.md
        - pages/tasks/practice-1.md
        - pages/tasks/practice-2.md

extra:
  generator: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
      block_syntax: ['dollar']
      inline_syntax: ['ignore']
  - pymdownx.highlight:
      linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
