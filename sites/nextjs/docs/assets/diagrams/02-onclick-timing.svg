<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title">
  <title id="title">Passing a function to onClick runs it on click; calling it inside onClick runs it during every render and causes an error</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 15px; }
      .m { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; font-size: 14px; }
      .h { font-size: 16px; font-weight: 700; }
      .mut { fill: #57606a; font-size: 13px; }
      .g { fill: #1a7f37; } .r { fill: #cf222e; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Left column: correct -->
  <rect x="25" y="20" width="340" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text class="m" x="195" y="46" text-anchor="middle">onClick={() =&gt; setCount(count + 1)}</text>
  <text class="h g" x="195" y="70" text-anchor="middle">Correct: a function for later</text>

  <rect x="55" y="110" width="280" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="195" y="137" text-anchor="middle">Page renders</text>
  <line x1="195" y1="154" x2="195" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="190" width="280" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="195" y="214" text-anchor="middle">React keeps the function</text>
  <text class="mut" x="195" y="234" text-anchor="middle">nothing runs yet</text>
  <line x1="195" y1="246" x2="195" y2="280" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="282" width="280" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="195" y="309" text-anchor="middle">The user clicks the button</text>
  <line x1="195" y1="326" x2="195" y2="360" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="362" width="280" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="195" y="386" text-anchor="middle">React runs the function</text>
  <text class="g" x="195" y="406" text-anchor="middle" font-weight="700">count goes up by 1</text>

  <!-- Divider -->
  <line x1="380" y1="20" x2="380" y2="440" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- Right column: wrong -->
  <rect x="395" y="20" width="340" height="62" rx="10" fill="#ffebe9" stroke="#cf222e"/>
  <text class="m" x="565" y="46" text-anchor="middle">onClick={setCount(count + 1)}</text>
  <text class="h r" x="565" y="70" text-anchor="middle">Wrong: runs straight away</text>

  <rect x="425" y="110" width="280" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="565" y="137" text-anchor="middle">Page renders</text>
  <line x1="565" y1="154" x2="565" y2="188" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="425" y="190" width="280" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="565" y="214" text-anchor="middle">setCount runs during the render</text>
  <text class="mut" x="565" y="234" text-anchor="middle">nobody clicked anything</text>
  <line x1="565" y1="246" x2="565" y2="280" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="425" y="282" width="280" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="565" y="309" text-anchor="middle">count changes, so it renders again</text>
  <path d="M705,304 C745,304 745,132 709,132" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowR)"/>
  <text class="r" x="742" y="222" text-anchor="middle" font-size="13" transform="rotate(90 742 222)">again and again</text>
  <line x1="565" y1="326" x2="565" y2="360" stroke="#cf222e" stroke-width="2" marker-end="url(#arrowR)"/>

  <rect x="425" y="362" width="280" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text class="r" x="565" y="386" text-anchor="middle" font-weight="700">Error: Too many re-renders</text>
  <text class="mut" x="565" y="406" text-anchor="middle">VS Code also underlines it in red</text>
</svg>
