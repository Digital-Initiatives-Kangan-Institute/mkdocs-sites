<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title">
  <title id="title">Turning a function declaration into an arrow function in three steps</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .m { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; font-size: 20px; }
      .lbl { font-size: 15px; fill: #57606a; }
      .b { font-weight: 700; }
      .g { fill: #1a7f37; } .r { fill: #cf222e; } .a { fill: #9a6700; }
      .num { font-size: 16px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Step 1 -->
  <rect x="30" y="30" width="660" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="62" cy="65" r="16" fill="#57606a"/>
  <text class="num" x="62" y="71" text-anchor="middle">1</text>
  <text class="m" x="95" y="72"><tspan class="r b">function add</tspan>(a, b) { return a + b; }</text>

  <line x1="120" y1="104" x2="120" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="140" y="130">Swap <tspan class="r b">function add</tspan> for <tspan class="g b">const add =</tspan></text>
  <text class="lbl" x="140" y="152">and put <tspan class="g b">=&gt;</tspan> after the ( )</text>

  <!-- Step 2 -->
  <rect x="30" y="170" width="660" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="62" cy="205" r="16" fill="#57606a"/>
  <text class="num" x="62" y="211" text-anchor="middle">2</text>
  <text class="m" x="95" y="212"><tspan class="g b">const add =</tspan> (a, b) <tspan class="g b">=&gt;</tspan> <tspan class="a b">{ return</tspan> a + b<tspan class="a b">; }</tspan></text>

  <line x1="120" y1="244" x2="120" y2="306" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="lbl" x="140" y="270">Only ONE expression inside the body?</text>
  <text class="lbl" x="140" y="292">Delete the <tspan class="a b">{ return</tspan> and the <tspan class="a b">; }</tspan></text>

  <!-- Step 3 -->
  <rect x="30" y="310" width="660" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="62" cy="345" r="16" fill="#1a7f37"/>
  <text class="num" x="62" y="351" text-anchor="middle">3</text>
  <text class="m" x="95" y="352">const add = (a, b) =&gt; <tspan class="g b">a + b</tspan>;</text>
  <text class="lbl g b" x="670" y="351" text-anchor="end">returned automatically</text>
</svg>
