<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="title">
  <title id="title">A useEffect with a fetch chain contains five arrow functions: the effect itself, two then callbacks, a catch callback and a finally callback, each running at a different time</title>
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 14px; }
      .m { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; font-size: 15px; }
      .p { fill: #8250df; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .mut { fill: #57606a; font-size: 13px; }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="328" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Code panel -->
  <rect x="20" y="20" width="470" height="290" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="h" x="36" y="46">The code</text>
  <text class="m" x="36" y="84">useEffect(<tspan class="p">() =&gt; {</tspan></text>
  <text class="m" x="60" y="116">fetch("/animals.json")</text>
  <text class="m" x="84" y="148">.then(<tspan class="p">(res) =&gt; res.json()</tspan>)</text>
  <text class="m" x="84" y="180">.then(<tspan class="p">(data) =&gt; setAnimals(data)</tspan>)</text>
  <text class="m" x="84" y="212">.catch(<tspan class="p">(err) =&gt; setError(err.message)</tspan>)</text>
  <text class="m" x="84" y="244">.finally(<tspan class="p">() =&gt; setLoading(false)</tspan>);</text>
  <text class="m" x="36" y="276"><tspan class="p">}</tspan>, []);</text>

  <g>
    <circle cx="466" cy="79" r="11" fill="#8250df"/><text class="num" x="466" y="84" text-anchor="middle">1</text>
    <circle cx="466" cy="143" r="11" fill="#8250df"/><text class="num" x="466" y="148" text-anchor="middle">2</text>
    <circle cx="466" cy="175" r="11" fill="#8250df"/><text class="num" x="466" y="180" text-anchor="middle">3</text>
    <circle cx="466" cy="207" r="11" fill="#8250df"/><text class="num" x="466" y="212" text-anchor="middle">4</text>
    <circle cx="466" cy="239" r="11" fill="#8250df"/><text class="num" x="466" y="244" text-anchor="middle">5</text>
  </g>

  <!-- Legend -->
  <text class="h" x="510" y="46">When each arrow function runs</text>

  <circle cx="522" cy="79" r="11" fill="#8250df"/><text class="num" x="522" y="84" text-anchor="middle">1</text>
  <text x="542" y="77" font-weight="700">After the first render</text>
  <text class="mut" x="542" y="95">React calls it. It starts the fetch.</text>

  <circle cx="522" cy="135" r="11" fill="#8250df"/><text class="num" x="522" y="140" text-anchor="middle">2</text>
  <text x="542" y="133" font-weight="700">When the server answers</text>
  <text class="mut" x="542" y="151">Turns the response into data.</text>

  <circle cx="522" cy="185" r="11" fill="#8250df"/><text class="num" x="522" y="190" text-anchor="middle">3</text>
  <text x="542" y="183" font-weight="700">When the data is ready</text>
  <text class="mut" x="542" y="201">Stores it in state, so the page re-renders.</text>

  <circle cx="522" cy="235" r="11" fill="#cf222e"/><text class="num" x="522" y="240" text-anchor="middle">4</text>
  <text x="542" y="233" font-weight="700">Only if something failed</text>
  <text class="mut" x="542" y="251">Skips 2 and 3 and jumps here.</text>

  <circle cx="522" cy="285" r="11" fill="#1a7f37"/><text class="num" x="522" y="290" text-anchor="middle">5</text>
  <text x="542" y="283" font-weight="700">Always, at the very end</text>
  <text class="mut" x="542" y="301">Worked or failed, loading is over.</text>
</svg>
