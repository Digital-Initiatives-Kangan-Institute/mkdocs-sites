<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-labelledby="title">
  <title id="title">app/books/page.tsx handles the URL /books; app/books/[id]/page.tsx handles /books/1, /books/2 and any other value</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 15px; }
      .m { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; font-size: 16px; }
      .h { font-size: 15px; font-weight: 700; }
      .mut { fill: #57606a; font-size: 13px; }
      .bl { fill: #0969da; } .p { fill: #8250df; }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="228" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <text class="h" x="40" y="36">Folders in your project</text>
  <text class="h" x="450" y="36">URLs in the browser</text>

  <text class="m" x="40" y="72">app/</text>
  <text class="m" x="64" y="100">books/</text>
  <rect x="84" y="110" width="180" height="32" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text class="m" x="94" y="132">page.tsx</text>
  <text class="m" x="88" y="168">[id]/</text>
  <rect x="108" y="176" width="180" height="32" rx="6" fill="#fbefff" stroke="#8250df"/>
  <text class="m" x="118" y="198">page.tsx</text>

  <line x1="266" y1="126" x2="448" y2="126" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="110" width="250" height="32" rx="16" fill="#ddf4ff" stroke="#0969da"/>
  <text class="m bl" x="575" y="132" text-anchor="middle">/books</text>

  <line x1="290" y1="192" x2="448" y2="192" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="176" width="250" height="32" rx="16" fill="#fbefff" stroke="#8250df"/>
  <text class="m p" x="575" y="198" text-anchor="middle">/books/1, /books/2, …</text>
  <text class="mut" x="369" y="184" text-anchor="middle">[id] matches anything</text>
</svg>
