# Settings shared by every site (theme name/custom_dir/features, extra_css,
# watch, markdown_extensions, copyright) live in shared/.mkdocs-base.yml and
# are merged in automatically. Do not touch the line below.
INHERIT: ../../shared/.mkdocs-base.yml

site_name: FastAPI

nav:
  # The Return to Portal item should always be the first item in the navigation.
  - Return to Portal: /

  # Add additional navigation below this point:
  - Menu:
    - Resources:
      - Introduction: pages/resources/intro.md
      - POST and PUT: pages/resources/posting.md
      - DELETE: pages/resources/put-delete.md
      - Database Connection: pages/resources/database-connection.md
      - Object Relational Mapper: pages/resources/orm.md
    - Tasks:
      - Introduction: pages/tasks/intro.md
      - POST and PUT: pages/tasks/posting.md
      - PUT and DELETE: pages/tasks/put-delete.md
      - Database Connection: pages/tasks/database-connection.md
      - ORM: pages/tasks/orm.md

# Do not touch anything below this line unless you know what you are doing.
theme:
  palette:
    primary: blue

plugins:
  - search
  - enumerate-headings:
      increment_across_pages: true
      # Uncomment below if you would like to reset the table of contents numbering
      # after a certain page:
      restart_increment_after:
        - pages/tasks/intro.md
