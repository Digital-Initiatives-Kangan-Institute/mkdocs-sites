<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="t">
  <title id="t">The CSS box model: content in the centre, surrounded by padding, then the border, then the margin on the outside</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00897b"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>
  <rect x="60" y="30" width="600" height="360" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="76" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" font-weight="700" text-anchor="start">margin</text>
  <text x="76" y="78" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#546e7a" font-weight="normal" text-anchor="start">space outside the border</text>
  <rect x="130" y="100" width="460" height="220" rx="4" fill="#00695c" stroke="none" stroke-width="1.5"/>
  <text x="590" y="90" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#00695c" font-weight="700" text-anchor="end">border</text>
  <rect x="140" y="110" width="440" height="200" rx="2" fill="#b2dfdb" stroke="none" stroke-width="1.5"/>
  <text x="154" y="134" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#00695c" font-weight="700" text-anchor="start">padding</text>
  <text x="154" y="152" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#00695c" font-weight="normal" text-anchor="start">space inside the border</text>
  <rect x="200" y="170" width="320" height="80" rx="2" fill="#ffffff" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="360.0" y="206.0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#263238" font-weight="700" text-anchor="middle">content</text>
  <text x="360.0" y="228.0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#546e7a" font-weight="normal" text-anchor="middle">width × height</text>
  <line x1="360.0" y1="34" x2="360.0" y2="96" stroke="#ef6c00" stroke-width="1.5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>
  <line x1="360.0" y1="114" x2="360.0" y2="166" stroke="#00695c" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
