<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#475569"/></marker></defs><title id="title">Anatomy of a CSS Rule</title><desc id="description">A labelled diagram explaining the parts of a CSS rule.</desc><rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Anatomy of a CSS Rule</text><rect x="220" y="231" width="760" height="218" rx="18" fill="#0f172a"/><g font-family="Consolas,'Courier New',monospace" font-size="42" font-weight="600"><text x="278" y="293" xml:space="preserve"><tspan fill="#e2e8f0"></tspan><tspan fill="#fbbf24">h1</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#c4b5fd">{</tspan></text><text x="278" y="351" xml:space="preserve"><tspan fill="#e2e8f0">  </tspan><tspan fill="#38bdf8">color</tspan><tspan fill="#cbd5e1">: </tspan><tspan fill="#86efac">darkslateblue</tspan><tspan fill="#f472b6">;</tspan><tspan fill="#e2e8f0"></tspan></text><text x="278" y="409" xml:space="preserve"><tspan fill="#c4b5fd">}</tspan></text></g><g><path d="M 205 180 C 228.25429815717408 221.12851158461265, 262.26498770815067 232.9778383701216, 282.8183898925781 251.9925079345703" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g class="label-drag" data-annotation-id="abq16ax2" style="cursor:default"><text x="105" y="150" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Selector</text><text x="105" y="178" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">what to style</text></g></g><g><path d="M 441.7557373046875 169.75164794921875 C 403.4124125380734 198.37482638397387, 403.5693552725438 227.68961964083562, 388.16058349609375 251.06845092773438" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g class="label-drag" data-annotation-id="ardv0umb" style="cursor:default"><text x="443.9476013183594" y="130.21512603759766" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Scope</text><text x="443.9476013183594" y="158.21512603759766" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">inside { }</text></g></g><g><path d="M 365.98321533203125 487.6263427734375 C 340.7313665082213 443.9906196356943, 361.10577655187785 401.92238772542635, 359.5148620605469 373.9676208496094" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g class="label-drag" data-annotation-id="ad0rfp55" style="cursor:default"><text x="277.79815673828125" y="522.1772766113281" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Key / Property</text><text x="277.79815673828125" y="550.1772766113281" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">the setting</text></g></g><g><path d="M 639.5032958984375 511.6517333984375 C 615.7542829690667 455.30201508911284, 651.7562561035156 396.32977600097655, 655.2122192382812 363.8030700683594" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g class="label-drag" data-annotation-id="as6r4v36" style="cursor:default"><text x="594.0889892578125" y="543.3164672851562" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">Value</text><text x="594.0889892578125" y="571.3164672851562" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">the chosen setting</text></g></g><g><path d="M 959.22607421875 476.53765869140625 C 903.5899063541477 446.60052415530015, 881.829736328125 377.8382849121094, 860 350" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g class="label-drag" data-annotation-id="aggi2hg1" style="cursor:default"><text x="9