<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img">
  <defs>
    <clipPath id="cs-app"><rect x="44" y="80" width="552" height="240" rx="10"/></clipPath>
    <pattern id="cs-grid" width="16" height="16" patternUnits="userSpaceOnUse" x="150" y="120">
      <rect width="16" height="16" fill="#fbfdff"/>
      <circle cx="8" cy="8" r="1" fill="#dbe3ee"/>
    </pattern>
    <linearGradient id="cs-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  </defs>
  <rect width="640" height="400" rx="18" fill="#0e0e11"/>
  <rect x="1" y="1" width="638" height="398" rx="17" fill="none" stroke="#232328" stroke-width="1.5"/>
  <rect x="28" y="28" width="584" height="344" rx="16" fill="#131316" stroke="#232328"/>
  <line x1="28" y1="64" x2="612" y2="64" stroke="#232328" stroke-width="1"/>
  <circle cx="56" cy="46" r="6" fill="#ff5f57"/>
  <circle cx="76" cy="46" r="6" fill="#febc2e"/>
  <circle cx="96" cy="46" r="6" fill="#28c840"/>
  <!-- app surface -->
  <rect x="44" y="80" width="552" height="240" rx="10" fill="#eef2f7" stroke="#dbe3ee"/>
  <g clip-path="url(#cs-app)">
    <!-- topbar -->
    <rect x="44" y="80" width="552" height="22" fill="#1e40af"/>
    <rect x="56" y="87" width="56" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="532" y="86" width="52" height="10" rx="5" fill="#0d9488"/>
    <!-- parts palette -->
    <rect x="44" y="102" width="96" height="218" fill="url(#cs-sheen)" stroke="#dbe3ee"/>
    <rect x="54" y="112" width="60" height="8" rx="4" fill="#475569" opacity="0.7"/>
    <rect x="54" y="128" width="34" height="26" rx="5" fill="#eff6ff" stroke="#dbeafe"/>
    <rect x="96" y="128" width="34" height="26" rx="5" fill="#ecfdf5" stroke="#a7f3d0"/>
    <rect x="54" y="160" width="34" height="26" rx="5" fill="#fffbeb" stroke="#fde68a"/>
    <rect x="96" y="160" width="34" height="26" rx="5" fill="#eef2ff" stroke="#e0e7ff"/>
    <rect x="54" y="192" width="34" height="26" rx="5" fill="#fef2f2" stroke="#fee2e2"/>
    <rect x="96" y="192" width="34" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
    <rect x="54" y="230" width="70" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="54" y="244" width="52" height="7" rx="3.5" fill="#94a3b8" opacity="0.55"/>
    <!-- tabs + toolbar -->
    <rect x="140" y="102" width="340" height="18" fill="#eef2f7"/>
    <rect x="148" y="106" width="58" height="14" rx="4" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="212" y="109" width="46" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="266" y="109" width="46" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <!-- schematic canvas -->
    <rect x="140" y="120" width="340" height="180" fill="url(#cs-grid)" stroke="#dbe3ee"/>
    <!-- circuit wires -->
    <polyline points="200,170 200,150 280,150" fill="none" stroke="#1e40af" stroke-width="2.5"/>
    <polyline points="336,150 400,150 400,180" fill="none" stroke="#1e40af" stroke-width="2.5"/>
    <polyline points="400,236 400,262 200,262 200,226" fill="none" stroke="#1e40af" stroke-width="2.5"/>
    <!-- battery -->
    <line x1="186" y1="182" x2="214" y2="182" stroke="#0f172a" stroke-width="3"/>
    <line x1="192" y1="194" x2="208" y2="194" stroke="#0f172a" stroke-width="3"/>
    <line x1="186" y1="206" x2="214" y2="206" stroke="#0f172a" stroke-width="3"/>
    <line x1="192" y1="218" x2="208" y2="218" stroke="#0f172a" stroke-width="3"/>
    <line x1="200" y1="170" x2="200" y2="182" stroke="#1e40af" stroke-width="2.5"/>
    <line x1="200" y1="218" x2="200" y2="226" stroke="#1e40af" stroke-width="2.5"/>
    <!-- resistor (selected) -->
    <rect x="274" y="136" width="68" height="28" rx="6" fill="none" stroke="#2563eb" stroke-width="5" opacity="0.25"/>
    <polyline points="280,150 286,142 296,158 306,142 316,158 326,142 336,150" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- LED -->
    <rect x="384" y="180" width="32" height="56" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <circle cx="400" cy="208" r="10" fill="#f59e0b" opacity="0.85"/>
    <!-- junction dots -->
    <circle cx="200" cy="150" r="3.5" fill="#1e40af"/>
    <circle cx="400" cy="262" r="3.5" fill="#1e40af"/>
    <circle cx="300" cy="262" r="3.5" fill="#0d9488"/>
    <!-- status strip -->
    <rect x="140" y="300" width="340" height="20" fill="#f1f5f9" stroke="#dbe3ee"/>
    <circle cx="154" cy="310" r="4" fill="#22c55e"/>
    <rect x="164" y="306" width="80" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="420" y="305" width="48" height="10" rx="5" fill="#dbeafe"/>
    <!-- properties panel -->
    <rect x="480" y="102" width="116" height="218" fill="url(#cs-sheen)" stroke="#dbe3ee"/>
    <rect x="492" y="112" width="70" height="8" rx="4" fill="#475569" opacity="0.7"/>
    <rect x="492" y="130" width="92" height="20" rx="5" fill="#f8fafc" stroke="#dbe3ee"/>
    <rect x="500" y="137" width="44" height="6" rx="3" fill="#0f172a" opacity="0.7"/>
    <rect x="492" y="158" width="92" height="20" rx="5" fill="#f8fafc" stroke="#dbe3ee"/>
    <rect x="500" y="165" width="30" height="6" rx="3" fill="#0f172a" opacity="0.6"/>
    <rect x="492" y="190" width="60" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="492" y="204" width="80" height="7" rx="3.5" fill="#94a3b8" opacity="0.55"/>
    <rect x="492" y="226" width="92" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <rect x="502" y="236" width="56" height="7" rx="3.5" fill="#0f766e" opacity="0.7"/>
    <rect x="502" y="250" width="40" height="7" rx="3.5" fill="#0f766e" opacity="0.5"/>
    <rect x="492" y="280" width="92" height="22" rx="11" fill="#2563eb"/>
  </g>
</svg>
