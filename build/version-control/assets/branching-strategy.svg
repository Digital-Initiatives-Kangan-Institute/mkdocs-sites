<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7" fill="none" stroke="#1565c0" stroke-width="1.5"/>
    </marker>
    <marker id="ah-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7" fill="none" stroke="#e65100" stroke-width="1.5"/>
    </marker>
    <symbol id="commit-node" overflow="visible">
      <circle r="7" fill="#fff" stroke-width="2.5"/>
      <circle r="3"/>
    </symbol>
  </defs>

  <style>
    text { stroke: #fff; stroke-width: 2.5; paint-order: stroke fill; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="960" height="430" rx="10" fill="#fcfcfc" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#333">
    Main / Dev / Feature Branching Strategy
  </text>

  <!-- ==================== BRANCH LINES ==================== -->

  <!-- main (green) -->
  <line x1="80" y1="90" x2="910" y2="90" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>

  <!-- dev (blue) -->
  <path d="M80,90 C120,90 120,200 160,200" stroke="#1565c0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="160" y1="200" x2="880" y2="200" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>

  <!-- feature/menu (orange) - branches off dev at x=200, merges back at x=480 -->
  <path d="M200,200 C240,200 240,310 280,310" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <line x1="280" y1="310" x2="400" y2="310" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M400,310 C440,310 440,200 480,200" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="5 4"/>

  <!-- feature/review (orange) - branches off dev at x=560, merges back at x=840 -->
  <path d="M560,200 C600,200 600,310 640,310" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <line x1="640" y1="310" x2="760" y2="310" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M760,310 C800,310 800,200 840,200" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="5 4"/>

  <!-- dev → main merge -->
  <path d="M880,200 C900,200 900,90 910,90" stroke="#1565c0" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>

  <!-- ==================== COMMIT NODES ==================== -->

  <!-- main commits -->
  <use href="#commit-node" x="80" y="90" stroke="#2e7d32" fill="#2e7d32"/>
  <use href="#commit-node" x="910" y="90" stroke="#2e7d32" fill="#2e7d32"/>
  <text x="80" y="72" text-anchor="middle" font-size="10" fill="#555">initial</text>
  <text x="910" y="72" text-anchor="middle" font-size="10" fill="#555">release</text>

  <!-- dev merge commits (created when feature branches merge in) -->
  <use href="#commit-node" x="480" y="200" stroke="#1565c0" fill="#1565c0"/>
  <use href="#commit-node" x="840" y="200" stroke="#1565c0" fill="#1565c0"/>

  <!-- feature/menu commits (work done on the branch) -->
  <use href="#commit-node" x="320" y="310" stroke="#e65100" fill="#e65100"/>
  <use href="#commit-node" x="360" y="310" stroke="#e65100" fill="#e65100"/>

  <!-- feature/review commits (work done on the branch) -->
  <use href="#commit-node" x="680" y="310" stroke="#e65100" fill="#e65100"/>
  <use href="#commit-node" x="720" y="310" stroke="#e65100" fill="#e65100"/>

  <!-- ==================== BRANCH LABELS ==================== -->

  <!-- Left-side branch labels -->
  <rect x="12" y="80" width="52" height="20" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="38" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#2e7d32">main</text>

  <rect x="12" y="190" width="52" height="20" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="38" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#1565c0">dev</text>

  <rect x="290" y="335" width="100" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="340" y="349" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">feature/menu</text>

  <rect x="650" y="335" width="110" height="20" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="705" y="349" text-anchor="middle" font-size="10" font-weight="600" fill="#e65100">feature/review</text>

  <!-- ==================== ANNOTATIONS ==================== -->

  <text x="895" y="145" text-anchor="middle" font-size="9" fill="#1565c0" font-style="italic">merge dev into main</text>
  <text x="440" y="255" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">merge into dev</text>
  <text x="800" y="255" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">merge into dev</text>
  <text x="120" y="150" text-anchor="middle" font-size="9" fill="#1565c0" font-style="italic">branch from main</text>
  <text x="240" y="265" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">branch from dev</text>
  <text x="580" y="265" text-anchor="middle" font-size="9" fill="#e65100" font-style="italic">branch from dev</text>

  <!-- ==================== VERTICAL LEGEND (bottom-left) ==================== -->

  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="140" height="130" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>

    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#333" letter-spacing="1">LEGEND</text>
    <line x1="12" y1="28" x2="128" y2="28" stroke="#eee" stroke-width="1"/>

    <line x1="14" y1="42" x2="38" y2="42" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="45" font-size="10" fill="#555">main branch</text>

    <line x1="14" y1="60" x2="38" y2="60" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="63" font-size="10" fill="#555">dev branch</text>

    <line x1="14" y1="78" x2="38" y2="78" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="81" font-size="10" fill="#555">feature branch</text>

    <line x1="14" y1="96" x2="38" y2="96" stroke="#888" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="46" y="99" font-size="10" fill="#555">merge</text>

    <use href="#commit-node" x="26" y="114" stroke="#888" fill="#888"/>
    <text x="46" y="117" font-size="10" fill="#555">commit</text>
  </g>
</svg>
