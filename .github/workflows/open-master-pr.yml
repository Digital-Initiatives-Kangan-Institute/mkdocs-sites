name: Create Master PR

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list \
            --base master \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR" ]; then
            echo "An existing dev → master PR already exists: #$PR"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing dev → master PR found."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base master \
            --head dev \
            --title "Merge dev into master" \
            --body "Automated PR from dev to master. Please review before merging."